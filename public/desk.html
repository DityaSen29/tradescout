function ops(n){

 if(n===1)return[o('read','read your request'),o('facts','product, capacity, certificates, markets',2,'llm/extract')];

function marks(b,m,text){
 const sp=[],ch=[];
 m.facts.forEach(f=>{const i=text.indexOf(f.t);if(f.t&&i>=0&&!sp.some(s=>i<s.e&&i+f.t.length>s.s))sp.push({s:i,e:i+f.t.length,f})});
 if(text!==m.body){
  const o=m.body.split('\n\n'),n=text.split('\n\n');let off=0;
  n.forEach((p,j)=>{const q=o[j]||'';if(p!==q){const a=p.split(/(\s+)/),c=q.split(/(\s+)/);let x=0,y=0;
   while(x<a.length&&x<c.length&&a[x]===c[x])x++;while(y<a.length-x&&y<c.length-x&&a[a.length-1-y]===c[c.length-1-y])y++;
   const s=off+a.slice(0,x).join('').length,t=a.slice(x,a.length-y).join('');{const k=Math.min(y,2);ch.push([c.slice(x,c.length-y+k).join(''),a.slice(x,a.length-y+k).join('')])}
   for(let i=sp.length-1;i>=0;i--)if(s<sp[i].e&&s+t.length>sp[i].s)sp.splice(i,1);
   if(t)sp.push({s,e:s+t.length});}off+=p.length+2});
  if(!ch.length)ch.push(['removed text','']);
 }
 sp.sort((a,c)=>a.s-c.s);let h='',i=0;
 for(const s of sp){h+=esc(text.slice(i,s.s))+(s.f?`<span class="hl" tabindex="0" data-pop="${esc(rec(s.f.k,{at:s.f.at}))}">${esc(text.slice(s.s,s.e))}${fn(s.f.k,{at:s.f.at})}</span>`:`<span class="ed" tabindex="0" data-pop="Your edit, not checked against a record">${esc(text.slice(s.s,s.e))}</span>`);i=s.e}
 h+=esc(text.slice(i));return{html:'<p>'+h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>',ch};
}

 S.wait=wait?'select':null;S.step=wait?5:d.report?8:(order.find(([n])=>!done.has(n))?.[1]||7);S.running=!!d.running;S.paused=!d.running&&d.run.status==='failed'?'stop':null;
 const key=wait?'wait':d.report?'done':'s'+S.step;if(key!==L.auto){L.auto=key;S.view=wait?'work':d.report?'approvals':VIEW[S.step];S.tab=S.step===6?'dm':'co'}
}
async function poll(){
 clearTimeout(timer);if(!L.id)return;
 try{const d=await api('/runs/'+encodeURIComponent(L.id)),c=await api(`/runs/${encodeURIComponent(L.id)}/ledger`),raw=JSON.stringify([d,c]);L.calls=c.calls||[];
  if(raw!==L.raw||L.err){L.raw=raw;L.err=null;adopt(d);bg()}
  if(d.running)timer=setTimeout(poll,2500);
 }catch(e){L.err=e.message;render()}
}
let es=null;
function follow(){
 es?.close();L.logs=[];es=new EventSource(`/api/runs/${encodeURIComponent(L.id)}/events`);
 const add=(k,t)=>{L.logs.push([k,t]);bg()};
 es.addEventListener('agent',e=>{const x=JSON.parse(e.data);add('ok',`${x.agent}: ${x.message}`)});
 es.addEventListener('step',e=>{const x=JSON.parse(e.data);add(/fail|unavailable/.test(x.status)?'w':'cur',`${x.name}: ${x.status}`)});
 const end=()=>{es.close();setTimeout(poll,300)};es.addEventListener('done',end);es.addEventListener('error',end);
}

/* Presenter shortcut: ?seed=done opens a finished run. */
if(!LIVE&&QS.get('seed')==='done'){S=fresh();S.t0=Date.now();enter(1);for(let i=0;i<200&&S.step<8;i++){if(S.wait==='codes')enter(3);else if(S.wait==='segs')enter(5);else{const o=ops(S.step).find(x=>!S.done[x.k]);if(!o){if(S.step===2){S.wait='codes'}else if(S.step===4){S.wait='segs'}else if(S.step===7){S.step=8;S.running=false}else enter(S.step+1)}else{S.credits+=o.cr;led(o.ep,o.cr,'ok',o.k);S.done[o.k]=1;logL(o.say)}}}S.launched=true;S.view='today';save();QS.delete('seed');history.replaceState(null,'',location.pathname+(QS.size?'?'+QS:''))}
if(LIVE){
 $('#tag').textContent='LIVE API · local';S.req='';
 api('/runs').then(r=>{L.runs=r;const id=QS.get('run');if(id&&r.some(x=>x.id===id)){L.id=id;follow();poll()}else render()}).catch(e=>{L.err='No backend here. Serve this file from the tradescout server. '+e.message;render()});
}else setInterval(tick,750);
setInterval(clock,1000);render();
</script></body></html>
