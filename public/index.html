<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian buyer desk</title>
<style>
:root{--ink:#17202b;--muted:#5c6773;--line:#d9dee3;--bg:#f6f7f8;--panel:#fff;--accent:#175cd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
main{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:16px;padding:16px}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
h1{font-size:16px;margin:0}h2{font-size:14px;margin:0 0 8px}
label{display:block;margin-bottom:8px;color:var(--muted)}
input,textarea{display:block;width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:4px}
input[type=checkbox]{display:inline;width:auto}
button{font:inherit;padding:6px 10px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
button.quiet{background:transparent;color:var(--accent)}button:disabled{opacity:.5}
.muted{color:var(--muted)}.row{padding:8px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
#trace{max-height:340px;overflow:auto}#trace b{display:inline-block;min-width:96px}
.body{white-space:pre-wrap}.locked{border-style:dashed}
</style>
</head>
<body>
<header><h1>Meridian buyer desk</h1><div><span id="status" class="muted"></span> · <span id="cost" class="muted"></span> · Approval mode</div></header>
<main>
  <div>
    <section><h2>Brief</h2>
      <form id="brief">
        <label>Your company, so your own customers are excluded<input name="client_name" minlength="4" maxlength="120"></label>
        <label>Exact product<input name="product" required></label>
        <label>HSN, if known<input name="hs_code" pattern="\d{4,8}"></label>
        <label>Market<input name="target_country" required></label>
        <label>Your offer, quotable in emails<textarea name="notes" rows="3" maxlength="1000"></textarea></label>
        <label>Don't contact: customers, agents, distributors, one per line<textarea name="do_not_contact" rows="3"></textarea></label>
        <button>Start agents</button>
      </form>
    </section>
    <section><h2>Runs</h2><div id="runs"></div></section>
    <section class="locked"><h2>Buyer intelligence</h2><p class="muted">Feature 2, coming next: reorder rhythm, next buying window, share of wallet and supplier switching.</p></section>
  </div>
  <div>
    <section><h2>Agents</h2><div id="trace" aria-live="polite"></div></section>
    <section><h2>Shortlist</h2><div id="shortlist"></div><button id="select" hidden>Enrich and draft for selected</button> <button id="resume" class="quiet" hidden>Resume</button></section>
  </div>
  <div>
    <section><h2>Waiting for your approval</h2><div id="drafts"></div></section>
    <section><h2>Every call</h2><div id="calls" class="muted"></div></section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
